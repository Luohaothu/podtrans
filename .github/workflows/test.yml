name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            tier: cpu
            build: true
          - name: macos-arm64
            os: macos-15
            tier: apple
            build: false
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q src tests
      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Smoke test installed CLI
        run: uv run --frozen podtrans --version
      - name: Assert detected profile on functional selection
        shell: bash
        run: |
          help="$(uv run --frozen podtrans --help)"
          printf '%s\n' "$help" | grep -q -- '--apple-generation'
          printf '%s\n' "$help" | grep -q -- '--unified-gb'
          printf '%s\n' "$help" | grep -q -- '--profile'
          name="$(uv run --frozen python -c 'from podtrans.profiles import detect_machine, select_machine; print(select_machine(detect_machine()).name)')"
          printf 'selected=%s\n' "$name"
          if [ "${{ matrix.tier }}" = "apple" ]; then
            printf '%s\n' "$name" | grep -Eq '^apple-m[0-9]+-[0-9]+gb$'
          else
            [ "$name" = "cpu" ]
          fi
      - name: Build wheel and source distribution
        if: matrix.build
        run: uv build
      - name: Verify wheel installation and console entry point
        if: matrix.build
        run: |
          uv venv /tmp/podtrans-wheel-test
          uv pip install \
            --python /tmp/podtrans-wheel-test/bin/python \
            --no-deps \
            dist/podtrans-0.2.0-py3-none-any.whl
          /tmp/podtrans-wheel-test/bin/podtrans --version
          /tmp/podtrans-wheel-test/bin/podtrans --help | grep -q -- '--apple-generation'
